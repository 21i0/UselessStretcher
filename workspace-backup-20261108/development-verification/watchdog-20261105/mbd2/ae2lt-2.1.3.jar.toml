# This is an example mods.toml file. It contains the data relating to the loading mods.
# There are several mandatory fields (#mandatory), and many more that are optional (#optional).
# The overall format is standard TOML format, v0.5.0.
# Note that there are a couple of TOML lists in this file.
# Find more information on toml format here:  https://github.com/toml-lang/toml
# The name of the mod loader type to load - for regular FML @Mod mods it should be javafml
modLoader = "javafml" #mandatory
# A version range to match for said mod loader - for regular FML @Mod it will be the the FML version. This is currently 47.
loaderVersion = "[4,)" #mandatory
# The license for you mod. This is mandatory metadata and allows for easier comprehension of your redistributive properties.
# Review your options at https://choosealicense.com/. All rights reserved is the default copyright stance, and is thus the default here.
license = "GNU LGPL 3.0"
# A URL to refer people to when problems occur with this mod
issueTrackerURL = "https://github.com/AE2-Lightning-Tech-Reborn/AE2-Lightning-Tech-Reborn/issues" #optional
# A list of mods - how many allowed here is determined by the individual mod loader
[[mods]] #mandatory
# The modid of the mod
modId = "ae2lt" #mandatory
# The version number of the mod
version = "2.1.3" #mandatory
# A display name for the mod
displayName = "AE2 Lightning Tech" #mandatory
# A URL to query for updates for this mod. See the JSON update specification https://docs.neoforge.net/docs/misc/updatechecker/
#updateJSONURL="https://change.me.example.invalid/updates.json" #optional
# A URL for the "homepage" for this mod, displayed in the mod UI
displayURL = "https://github.com/AE2-Lightning-Tech-Reborn/AE2-Lightning-Tech-Reborn" #optional
# A file name (in the root of the mod JAR) containing a logo for display
logoFile = "ae2lt.png" #optional
# A text field displayed in the mod UI
#credits="" #optional
# A text field displayed in the mod UI
authors = "MOAKIEE,CystrySU,gjmhmm8,_leng,TedXenon,MHanHanBing" #optional

# The description text for the mod (multi line!) (#mandatory)
description = '''An AE2 addon that introduces a lightning energy system, advanced machines, and overloaded network components.'''

# The [[mixins]] block allows you to declare your mixin config to FML so that it gets loaded.
[[mixins]]
config = "ae2lt.mixins.json"

# Optional JEI/EMI recipe-transfer hooks. A config plugin applies each mixin only
# when its viewer and integration target are present.
[[mixins]]
config = "ae2lt.recipeviewer.mixins.json"

# Optional ae2wtlib integration mixins. The config's plugin disables every
# mixin in it when ae2wtlib is absent, so this is safe to always declare.
[[mixins]]
config = "ae2lt.ae2wtlib.mixins.json"

# Optional Mekanism armor conversion hook. The config plugin disables it when Mekanism is absent.
[[mixins]]
config = "ae2lt.mekanism.mixins.json"

# Applied Flux adds its own adjacent-output ticker to AE2 interfaces. In
# wireless mode the overloaded interface routes FE through its bound targets.
[[mixins]]
config = "ae2lt.appflux.mixins.json"

# The [[accessTransformers]] block allows you to declare where your AT file is.
# If this block is omitted, a fallback attempt will be made to load an AT from META-INF/accesstransformer.cfg
#[[accessTransformers]]
#file="META-INF/accesstransformer.cfg"

# The coremods config file path is not configurable and is always loaded from META-INF/coremods.json

# A dependency - use the . to indicate dependency for a specific modid. Dependencies are optional.
[[dependencies."ae2lt"]] #optional
# the modid of the dependency
modId = "neoforge" #mandatory
# The type of the dependency. Can be one of "required", "optional", "incompatible" or "discouraged" (case insensitive).
# 'required' requires the mod to exist, 'optional' does not
# 'incompatible' will prevent the game from loading when the mod exists, and 'discouraged' will show a warning
type = "required" #mandatory
# Optional field describing why the dependency is required or why it is incompatible
# reason="..."
# The version range of the dependency
versionRange = "[21.1.220,)" #mandatory
# An ordering relationship for the dependency.
# BEFORE - This mod is loaded BEFORE the dependency
# AFTER - This mod is loaded AFTER the dependency
ordering = "NONE"
# Side this dependency is applied on - BOTH, CLIENT, or SERVER
side = "BOTH"
# Here's another dependency
[[dependencies."ae2lt"]]
modId = "minecraft"
type = "required"
# This version range declares a minimum of the current minecraft version up to but not including the next major version
versionRange = "[1.21.1,1.22)"
ordering = "NONE"
side = "BOTH"

[[dependencies."ae2lt"]]
modId = "ae2"
type = "required"
versionRange = "[19.2.17,19.3)"
ordering = "AFTER"
side = "BOTH"

# The embedded AE2WTLib API owns the AddTerminalEvent item-registry callback.
# Load AE2LT before it so our terminal-registration handler is installed before
# the API consumes that one-shot callback list.
[[dependencies."ae2lt"]]
modId = "ae2wtlib_api"
type = "required"
versionRange = "*"
ordering = "BEFORE"
side = "BOTH"

[[dependencies."ae2lt"]]
modId = "veil"
type = "optional"
# Compatibility is checked against the client API at runtime. Keeping this unrestricted lets
# AE2LT start and use its native shader backend when an unsupported Veil version is installed.
versionRange = "*"
ordering = "AFTER"
side = "CLIENT"

# Thunderbolt Core Reborn hosts the extracted AE2 infrastructure (fast crafting planner, channel/batch/cell/
# matrix algorithms). Required: ae2lt's mixins and logic depend on its classes at runtime.
[[dependencies."ae2lt"]]
modId = "thunderbolt"
type = "required"
versionRange = "[2.0.3,3.0.0)"
ordering = "AFTER"
side = "BOTH"

[[dependencies."ae2lt"]]
modId = "neoecoae"
type = "optional"
versionRange = "[21.2.0-beta3,)"
# FastPath is used at runtime; NeoECO already orders itself after AE2LT.
# Requiring the reverse order here would create a loading cycle.
ordering = "NONE"
side = "BOTH"

[[dependencies."ae2lt"]]
modId = "flywheel"
type = "optional"
versionRange = "[0,)"
ordering = "AFTER"
side = "CLIENT"

[[dependencies."ae2lt"]]
modId = "ponder"
type = "optional"
versionRange = "[0,)"
ordering = "AFTER"
side = "CLIENT"

[[dependencies."ae2lt"]]
modId = "jade"
type = "optional"
versionRange = "[0,)"
ordering = "AFTER"
side = "CLIENT"

[[dependencies."ae2lt"]]
modId = "advanced_ae"
type = "optional"
# Reaction recipes switched from Glodium to AE2AddonLib's IngredientStack in 1.6.7.
versionRange = "[1.6.7-1.21.1,)"
ordering = "AFTER"
side = "BOTH"

[[dependencies."ae2lt"]]
modId = "extendedae"
type = "optional"
versionRange = "[0,)"
ordering = "AFTER"
side = "BOTH"

[[dependencies."ae2lt"]]
modId = "extendedae_plus"
type = "optional"
versionRange = "[0,)"
# Runtime-only integration; avoid a load-order cycle through NeoECO.
ordering = "NONE"
side = "BOTH"

[[dependencies."ae2lt"]]
modId = "appflux"
type = "optional"
versionRange = "[0,)"
ordering = "AFTER"
side = "BOTH"

[[dependencies."ae2lt"]]
modId = "curios"
type = "optional"
versionRange = "[9.5.1,)"
ordering = "AFTER"
side = "BOTH"

[[dependencies."ae2lt"]]
modId = "ae2jeiintegration"
type = "optional"
versionRange = "[0,)"
ordering = "AFTER"
side = "CLIENT"

[[dependencies."ae2lt"]]
modId = "ae2wtlib"
type = "optional"
versionRange = "[0,)"
ordering = "AFTER"
side = "BOTH"

[[dependencies."ae2lt"]]
modId = "omni_upgrades"
type = "optional"
# 1.0.4 restores frequency cards' own right-click actions instead of intercepting them as upgrades.
versionRange = "[1.0.4-1.21.1,)"
# Only the version constraint is needed; AFTER creates a cycle through Productive Bees Genesis.
ordering = "NONE"
side = "BOTH"

[[dependencies."ae2lt"]]
modId = "ae2ltpp"
type = "optional"
versionRange = "[1.2.0-beta.1,)"
ordering = "BEFORE"
side = "BOTH"

[[dependencies."ae2lt"]]
modId = "jei"
type = "optional"
versionRange = "[0,)"
ordering = "AFTER"
side = "CLIENT"

[[dependencies."ae2lt"]]
modId = "emi"
type = "optional"
versionRange = "[0,)"
ordering = "AFTER"
side = "CLIENT"

# Features are specific properties of the game environment, that you may want to declare you require. This example declares
# that your mod requires GL version 3.2 or higher. Other features will be added. They are side aware so declaring this won't
# stop your mod loading on the server for example.
#[features."ae2lt"]
#openGLVersion="[3.2,)"


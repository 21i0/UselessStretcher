// Real client/server checks for the complete Forge companion and visual novel.
if (providers.gradleProperty('dollChecks').isPresent()) {
    sourceSets.main.java.srcDirs 'src/regression/java', 'src/storyTest/java', 'src/dollCheck/java'
    sourceSets.main.resources.srcDir 'src/regression/resources'
    if (providers.gradleProperty('dollCaptureRepository').isPresent()) {
        repositories.maven {
            url = uri(providers.gradleProperty('dollCaptureRepository').get())
            content { includeGroup 'verification.capture' }
        }
    }
    dependencies {
        modRuntimeOnly 'maven.modrinth:XxWD5pD3:Zfyso1sP'
        modRuntimeOnly 'maven.modrinth:guideme:i7Tp1AHw'
        modRuntimeOnly 'maven.modrinth:vvuO3ImH:IPQlZkz1'
        if (!providers.gradleProperty('dollWithoutJei').isPresent())
            modRuntimeOnly 'maven.modrinth:u6dRKJwZ:zzpNSbJZ'
        if (uselessModDevJar.isPresent()) runtimeOnly files(uselessModDevJar.get())
        else modRuntimeOnly uselessModRelease
        if (providers.gradleProperty('dollCaptureChecks').isPresent()) {
            if (providers.gradleProperty('dollCaptureRepository').isPresent()) {
                modRuntimeOnly 'verification.capture:ars_nouveau:4.12.7'
                modRuntimeOnly 'verification.capture:productivebees:12.6.0'
            } else {
                modRuntimeOnly 'maven.modrinth:TKB6INcv:Hw2aD01e'
                modRuntimeOnly 'maven.modrinth:jH6iiqkd:mywVOObd'
            }
            modRuntimeOnly 'maven.modrinth:8BmcQJ2H:aVW7Z5da'
        }
    }
    legacyForge.runs {
        dollServerCheck {
            server()
            gameDirectory = file(providers.gradleProperty('dollServerDirectory').getOrElse('run/doll-server-check'))
            programArgument '--nogui'
            systemProperty 'stretcher.dollCheck', 'true'
            systemProperty 'stretcher.dollCaptureOnly', providers.gradleProperty('dollCaptureChecks').isPresent().toString()
        }
        dollClientCheck {
            client()
            gameDirectory = file(providers.gradleProperty('dollClientDirectory').getOrElse('run/doll-client-check'))
            programArguments.addAll '--width', '1280', '--height', '800'
            systemProperty 'useless_stretcher.story_test', 'true'
            systemProperty 'useless_stretcher.skin_tail_only', providers.gradleProperty('skinTailOnly').getOrElse('false')
            jvmArguments.addAll '-Xmx3G', '-Xms1G'
        }
    }
}

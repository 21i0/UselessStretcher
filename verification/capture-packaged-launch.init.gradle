// Capture ModDev's resolved runtime without launching source classes.
gradle.projectsEvaluated {
    rootProject.tasks.named('runRegression').configure {
        doFirst {
            def launch = [classpath: classpathProvider.files.collect { it.absolutePath },
                          jvmArgs: allJvmArgs, args: args, main: mainClass.get(),
                          environment: environmentProperty.get()]
            new File(rootProject.projectDir, 'build/occultism-production-launch.json').text = groovy.json.JsonOutput.prettyPrint(groovy.json.JsonOutput.toJson(launch))
            throw new org.gradle.api.tasks.StopExecutionException('Launch configuration captured; no game launched')
        }
    }
}

plugins {
    id 'java-library'
    id 'maven-publish'
    id 'net.neoforged.moddev.legacyforge' version '2.0.107'
    id 'idea'
}
version = mod_version
group = mod_group_id
base { archivesName = mod_id }
java.toolchain.languageVersion = JavaLanguageVersion.of(17)
repositories {
    mavenCentral()
    exclusiveContent {
        forRepository {
            if (providers.gradleProperty('uselessModRepository').isPresent()) {
                maven { url = uri(providers.gradleProperty('uselessModRepository').get()) }
            } else {
                ivy {
                    name = 'UselessModReleases'
                    url = 'https://github.com/SorrowMist/UselessMod/releases/download'
                    patternLayout { artifact '[revision]/[artifact]-[revision].[ext]' }
                    metadataSources { artifact() }
                }
            }
        }
        filter { includeModule 'com.sorrowmist.useless', 'useless_mod' }
    }
    exclusiveContent {
        forRepository { maven { url = 'https://api.modrinth.com/maven' } }
        filter { includeGroup 'maven.modrinth' }
    }
    exclusiveContent {
        forRepository { maven { url = 'https://cursemaven.com' } }
        filter { includeGroup 'curse.maven' }
    }
    maven { url = 'https://maven.createmod.net' }
    maven { url = 'https://maven.tterrag.com' }
    maven { url = 'https://maven.minecraftforge.net/' }
    maven { url = 'https://repo.spongepowered.org/repository/maven-public/' }
}
legacyForge {
    version = "${minecraft_version}-${forge_version}"
    runs {
        client { client(); gameDirectory = file('run/port-client') }
        server { server(); gameDirectory = file('run/port-server'); programArgument '--nogui' }
    }
    mods { "${mod_id}" { sourceSet sourceSets.main } }
}
sourceSets.main.resources { srcDir 'src/generated/resources' }
sourceSets.test.compileClasspath += sourceSets.main.compileClasspath
sourceSets.test.runtimeClasspath += sourceSets.main.compileClasspath
// ModDev remaps the published Apple UI build. Local development jars are opt-in.
ext.uselessModRelease = 'com.sorrowmist.useless:useless_mod:20.2.4.9'
ext.uselessModDevJar = providers.gradleProperty('uselessModDevJar').map { file(it) }
configurations.modCompileOnly.transitive = false
tasks.named('compileJava') {
    doFirst {
        if (uselessModDevJar.isPresent()) {
            if (!uselessModDevJar.get().isFile())
                throw new GradleException('uselessModDevJar must point to a matching build/devlibs development jar.')
            new java.util.zip.ZipFile(uselessModDevJar.get()).withCloseable { api ->
                if (api.getEntry('com/sorrowmist/useless/client/gui/ldl/api/ApplePanelScreen.class') == null)
                    throw new GradleException('Useless Mod must include the Apple UI API (20.2.4.9 UI build or newer).')
            }
        }
    }
}
dependencies {
    modCompileOnly 'maven.modrinth:sbJh4AZw:hs5pHmiU' // occultism-1.20.1-1.158.0
    modCompileOnly 'maven.modrinth:smartbrainlib:YkeJNm33' // SpiritEntity superclass
    modCompileOnly 'maven.modrinth:e0IclJLr:DrVfKfKP' // rftoolsbuilder-1.20-6.0.10
    modCompileOnly 'maven.modrinth:1Zu0uTEE:GIASnLXz' // mcjtylib-1.20-8.0.8
    modCompileOnly 'maven.modrinth:hIO8IsD8:dYvtIH7M' // rftoolsbase-1.20-5.0.7
    modCompileOnly 'maven.modrinth:rxYaglEe:orFPvySe' // advancedae-1.2.7-1.20.1
    modCompileOnly 'maven.modrinth:rqFWfVlz:tT3CLYvK' // apotheosis-1.20.1-7.4.8
    modCompileOnly 'maven.modrinth:IiATswDj:9n9p68Qq' // applied-mekanistics-1.4.3
    modCompileOnly 'maven.modrinth:XxWD5pD3:Zfyso1sP' // appliedenergistics2-forge-15.4.8
    modCompileOnly 'curse.maven:applied-flux-965012:6755986' // appliedflux-1.20-1.3.2-forge
    modCompileOnly 'maven.modrinth:lhGA9TYQ:1MKTLiiG' // architectury-9.2.14-forge
    modCompileOnly 'maven.modrinth:uy4Cnpcm:tNwsir0K' // bookshelf-forge-1.20.1-20.2.13
    modCompileOnly 'maven.modrinth:U6BUTZ7K:9bH71LWw' // botanypots-forge-1.20.1-13.0.41
    modCompileOnly 'maven.modrinth:iFDWVIFV:qFTHdrDH' // brandonscore-1.20.1-3.2.1.302-universal
    modCompileOnly 'maven.modrinth:LNytGWDc:JjPQsQVw' // create-1.20.1-6.0.6
    modCompileOnly 'maven.modrinth:vvuO3ImH:IPQlZkz1' // curios-forge-5.14.1-1.20.1
    modCompileOnly 'maven.modrinth:nBqivi8H:YR33MHbk' // draconic-evolution-1.20.1-3.1.2.621-universal
    modCompileOnly 'maven.modrinth:49ZofO4f:1na1IiE8' // enderio-1.20.1-6.2.13-beta-all
    modCompileOnly 'curse.maven:ex-deorum-901420:6614784' // exdeorum-1.46
    modCompileOnly 'curse.maven:extendedae-892005:7005572' // extendedae-1.20-1.4.6-forge
    modCompileOnly 'maven.modrinth:5JMG1gql:NtEZsGjO' // extendedcrafting-1.20.1-6.1.5u
    modCompileOnly 'curse.maven:flux-networks-248020:5234697' // fluxnetworks-1.20.1-7.2.1.15
    modCompileOnly 'curse.maven:ftb-chunks-314906:6431735' // ftb-chunks-forge-2001.3.6
    modCompileOnly 'curse.maven:ftb-teams-404468:6130786' // ftb-teams-forge-2001.3.1
    modCompileOnly 'curse.maven:ftb-ultimine-386134:6899418' // ftb-ultimine-forge-2001.1.7
    modCompileOnly 'maven.modrinth:8BmcQJ2H:aVW7Z5da' // geckolib-forge-1.20.1-4.8.2
    modCompileOnly 'maven.modrinth:6bLUlbZn:6ByGTKSc' // hostileneuralnetworks-1.20.1-5.3.3
    modCompileOnly 'maven.modrinth:lWxpUd04:O8YO7ORj' // industrial-foregoing-1.20.1-3.5.19
    modCompileOnly 'maven.modrinth:nvQzSEkH:LecuGude' // jade-1.20.1-forge-11.13.2
    modCompileOnly 'maven.modrinth:u6dRKJwZ:zzpNSbJZ' // jei-1.20.1-forge-15.20.0.116
    modCompileOnly 'maven.modrinth:umyGl7zF:g5igndAv' // kubejs-forge-2001.6.5-build.16
    modCompileOnly 'maven.modrinth:Ce6I4WUE:uxe1WQp4' // mekanism-1.20.1-10.4.16.80
    modCompileOnly 'maven.modrinth:OFVYKsAk:Th4Czz4N' // mekanismgenerators-1.20.1-10.4.16.80
    modCompileOnly 'maven.modrinth:tCkE8p2N:6SkuAGoz' // placebo-1.20.1-8.6.3
    modCompileOnly 'maven.modrinth:KZO4S4DO:xDOvxyqP' // powah-5.0.11
    modCompileOnly 'maven.modrinth:sk9knFPE:uNALdylI' // rhino-forge-2001.2.3-build.10
    modCompileOnly 'maven.modrinth:19smZ71v:zAGXClGI' // summoningrituals-forge-1.20.1-2.0.8
    modCompileOnly 'maven.modrinth:1Ro7m06l:8krhHkrZ' // titanium-1.20.1-3.8.32
    if (uselessModDevJar.isPresent()) compileOnly files(uselessModDevJar.get())
    else modCompileOnly uselessModRelease
    compileOnly 'io.github.llamalad7:mixinextras-common:0.5.0'
    annotationProcessor 'org.spongepowered:mixin:0.8.5:processor'
    annotationProcessor 'io.github.llamalad7:mixinextras-common:0.5.0'
    // Forge 47 does not ship MixinExtras. Keep WrapMethod and the shared base
    // mod's injectors available even in a minimal AE2 + Useless Mod installation.
    implementation 'io.github.llamalad7:mixinextras-forge:0.5.0'
    jarJar('io.github.llamalad7:mixinextras-forge:0.5.0') {
        version { strictly '[0.5.0,0.6)'; prefer '0.5.0' }
    }
    testImplementation platform('org.junit:junit-bom:5.11.4')
    testImplementation 'org.junit.jupiter:junit-jupiter'
    testImplementation 'org.mockito:mockito-core:5.15.2'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
    testRuntimeOnly 'org.slf4j:slf4j-api:2.0.1'
}
mixin {
    add sourceSets.main, "${mod_id}.refmap.json"
    config "${mod_id}.mixins.json"
}
tasks.named('jar') {
    manifest.attributes('MixinConfigs': "${mod_id}.mixins.json")
    // Opt-in game checks may compile alongside the mod, but never ship in any jar.
    exclude '**/*Checks*.class', '**/capsulecheck/**', '**/upstreamcheck/**',
            '**/regression/**', '**/storytest/**',
            'data/stretcher_capsule_check/**', 'data/useless_stretcher_test/**'
}
tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
    options.compilerArgs += ['-Xmaxerrs', '1500']
}
tasks.named('test', Test) {
    dependsOn 'jar', 'reobfJar'
    useJUnitPlatform()
}
tasks.named('processResources', ProcessResources) {
    inputs.property 'mod_version', mod_version
    filesMatching('META-INF/mods.toml') {
        expand mod_id: mod_id, mod_name: mod_name, mod_version: mod_version
    }
}

apply from: 'gradle/capsule-checks.gradle'
apply from: 'gradle/doll-checks.gradle'
apply from: 'gradle/upstream-checks.gradle'
